[package]
name = "neteumbra-profile"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
publish = false
description = "Generates the animated SVG stage and README for github.com/neteumbra"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
quick-xml = "0.36"
serde_json = "1"

[profile.release]
lto = true
strip = true

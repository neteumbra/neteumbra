.edge{animation:edge 6.40s linear 1.60s infinite}
@keyframes sel{0%,18.00%{opacity:.075}25.00%,100%{opacity:0}}
@keyframes edge{0%,18.00%{opacity:.9}25.00%,100%{opacity:0}}

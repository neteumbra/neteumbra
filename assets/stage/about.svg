<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 248" width="900" height="248" role="img" aria-label="01 / About Mauricio — fullstack developer. Web, APIs, Linux and security; also a Spanish-language hacking and Linux channel."><title>01 / About Mauricio — fullstack developer. Web, APIs, Linux and security; also a Spanish-language hacking and Linux channel.</title><style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace;}
.blink{animation:blink 1.15s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.rise{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.slam{animation:slam .5s cubic-bezier(.22,1,.36,1) both}
@keyframes slam{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.mq{animation:mq var(--mq-dur) linear infinite}
@keyframes mq{to{transform:translateX(var(--mq-shift))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><defs></defs><rect width="900" height="248" fill="#05090a"/><text x="48" y="34" font-size="10" fill="#7df29a" letter-spacing="2.4">01 / ABOUT</text><text x="852" y="34" font-size="9" fill="#7e8f86" letter-spacing="1.6" text-anchor="end">[ FULLSTACK DEVELOPER ]</text><rect x="48" y="48" width="804" height="1" fill="rgba(242,246,241,0.10)"/><rect x="48" y="48" width="54" height="1" fill="#7df29a"/><rect x="48" y="66" width="44" height="2" fill="#7df29a"/><text class="rise" style="animation-delay:0.06s" x="48" y="100.0" font-size="23" fill="#f2f6f1" letter-spacing=".2">I build websites, APIs and tools with one rule: security</text><text class="rise" style="animation-delay:0.13s" x="48" y="131.0" font-size="23" fill="#f2f6f1" letter-spacing=".2">is designed in from day one.</text><rect x="48" y="154.0" width="804" height="1" fill="rgba(242,246,241,0.10)"/><rect x="450.0" y="166.0" width="1" height="60.0" fill="rgba(242,246,241,0.10)"/><text x="48" y="180.0" font-size="14" fill="#a8b6ae" letter-spacing=".1">Astro and TypeScript on the frontend,</text><text x="48" y="201.0" font-size="14" fill="#a8b6ae" letter-spacing=".1">Spring Boot and PostgreSQL on the</text><text x="48" y="222.0" font-size="14" fill="#a8b6ae" letter-spacing=".1">backend, Linux underneath.</text><text x="502.0" y="180.0" font-size="14" fill="#a8b6ae" letter-spacing=".1">I also run NeTenebrae, a Spanish-language</text><text x="502.0" y="201.0" font-size="14" fill="#a8b6ae" letter-spacing=".1">channel about hacking and Linux with</text><text x="502.0" y="222.0" font-size="14" fill="#a8b6ae" letter-spacing=".1">17.5K subscribers.</text></svg>

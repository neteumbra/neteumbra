<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 178" width="900" height="178" role="img" aria-label="I build websites, APIs and tools with one rule: security is designed in from day one. Astro and TypeScript on the frontend, Spring Boot and PostgreSQL on the backend, Linux underneath. I also run NeTenebrae, a Spanish-language channel about hacking and Linux with 17.5K subscribers."><title>I build websites, APIs and tools with one rule: security is designed in from day one. Astro and TypeScript on the frontend, Spring Boot and PostgreSQL on the backend, Linux underneath. I also run NeTenebrae, a Spanish-language channel about hacking and Linux with 17.5K subscribers.</title><style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace;}
.blink{animation:blink 1.15s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.rise{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.slam{animation:slam .5s cubic-bezier(.22,1,.36,1) both}
@keyframes slam{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.mq{animation:mq var(--mq-dur) linear infinite}
@keyframes mq{to{transform:translateX(var(--mq-shift))}}
.scan{animation:scan 7s linear infinite}
@keyframes scan{from{transform:translateY(-150px)}to{transform:translateY(520px)}}
.gA{animation:gA 9s steps(1,end) infinite}
.gB{animation:gB 9s steps(1,end) infinite;animation-delay:4.6s}
@keyframes gA{0%,88%,100%{opacity:0;transform:translate(0,0)}89%{opacity:.55;transform:translate(-3px,1px)}92%{opacity:.3;transform:translate(3px,-1px)}95%{opacity:.45;transform:translate(-2px,0)}}
@keyframes gB{0%,90%,100%{opacity:0;transform:translate(0,0)}91%{opacity:.4;transform:translate(3px,1px)}94%{opacity:.25;transform:translate(-3px,-1px)}97%{opacity:.4;transform:translate(2px,0)}}
@keyframes type1{from{width:0}to{width:var(--w1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><defs><clipPath id="frame"><rect width="900" height="178" rx="12"/></clipPath></defs><g clip-path="url(#frame)"><rect width="900" height="178" rx="12" fill="#0a1113" stroke="rgba(242,246,241,0.20)"/><path d="M0 34H900V0H0Z" fill="#0e1719"/><rect x="0" y="34" width="900" height="1" fill="rgba(242,246,241,0.10)"/><circle cx="18" cy="17" r="3.4" fill="#7e8f86"/><circle cx="30" cy="17" r="3.4" fill="#7e8f86"/><circle cx="42" cy="17" r="3.4" fill="#7e8f86"/><text x="70" y="21" font-size="9.5" fill="#7e8f86" letter-spacing="1">~/about.md</text><text x="860" y="21" font-size="9" fill="#7df29a" letter-spacing="1.4" text-anchor="end">[ READ ]</text><text x="40" y="62" font-size="12" fill="#7df29a" letter-spacing=".5">$</text><text x="54" y="62" font-size="12" fill="#f2f6f1" letter-spacing=".5">cat about.md</text><rect x="22" y="73" width="2" height="94" fill="#7df29a" fill-opacity=".55"/><text class="rise" style="animation-delay:0.15s" x="40" y="90.0" font-size="14" fill="#f2f6f1" letter-spacing=".1">I build websites, APIs and tools with one rule: security is designed in from day one. Astro</text><text class="rise" style="animation-delay:0.25s" x="40" y="114.0" font-size="14" fill="#f2f6f1" letter-spacing=".1">and TypeScript on the frontend, Spring Boot and PostgreSQL on the backend, Linux underneath.</text><text class="rise" style="animation-delay:0.35s" x="40" y="138.0" font-size="14" fill="#f2f6f1" letter-spacing=".1">I also run NeTenebrae, a Spanish-language channel about hacking and Linux with 17.5K</text><text class="rise" style="animation-delay:0.45s" x="40" y="162.0" font-size="14" fill="#f2f6f1" letter-spacing=".1">subscribers.</text><rect class="blink" x="149.2" y="151.0" width="7" height="14" fill="#7df29a"/></g></svg>

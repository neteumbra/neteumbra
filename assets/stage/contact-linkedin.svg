<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 44" width="150" height="44" role="img" aria-label="LINKEDIN"><title>LINKEDIN</title><style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace;}
.blink{animation:blink 1.15s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.rise{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.slam{animation:slam .5s cubic-bezier(.22,1,.36,1) both}
@keyframes slam{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.mq{animation:mq var(--mq-dur) linear infinite}
@keyframes mq{to{transform:translateX(var(--mq-shift))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><defs></defs><rect x=".5" y=".5" width="149" height="43" rx="8" fill="#0a1113" stroke="rgba(242,246,241,0.20)"/><text x="75" y="27" font-size="10.5" fill="#a8b6ae" letter-spacing="1.8" text-anchor="middle">LINKEDIN ↗</text></svg>
